[package]
name = "systemd_minecraft"
version = "6.1.3"
authors = ["Fenhl <fenhl@fenhl.net>"]
edition = "2024"
rust-version = "1.95" # nixpkgs stable

[lints.rust]
#missing_docs = "deny" #TODO uncomment
rust_2018_idioms = "deny"
unsafe_code = "forbid"
unused = "deny"
unused_import_braces = "deny"
unused_qualifications = "deny"
warnings = "deny"

[lib]
name = "systemd_minecraft"
path = "src/lib.rs"

[[bin]]
name = "minecraft"
path = "src/main.rs"
doc = false

[features]
rocket = ["lazy-regex", "dep:rocket"]

[dependencies]
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
craftping = { version = "0.7", default-features = false, features = ["async-tokio"] }
futures = "0.3"
itertools = "0.15"
lazy-regex = { version = "3", optional = true }
minecraft = { git = "https://github.com/wurstmineberg/rust-minecraft-types" }
rcon = { version = "0.6", features = ["rt-tokio"] }
reqwest = { version = "0.13", default-features = false, features = ["charset", "gzip", "hickory-dns", "http2", "json", "rustls-no-provider", "stream", "system-proxy", "zstd"] }
rocket = { git = "https://github.com/fenhl/Rocket", branch = "forms", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "macros", "net", "process", "rt-multi-thread"] }
tokio-stream = { version = "0.1", features = ["io-util"] }
tokio-util = { version = "0.7", features = ["compat"] }
url = { version = "2", features = ["serde"] }
wheel = { git = "https://github.com/fenhl/wheel" }

[target.'cfg(unix)'.dependencies]
crossbeam-channel = "0.5"
signal-hook = "0.3"
